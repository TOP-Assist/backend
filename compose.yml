services:
  backend:
    restart: on-failure
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - 8000:8000
    env_file: .env
    environment:
      - LOG_LEVEL=DEBUG
      - MONGODB_HOST=mongo
      - MONGODB_USERNAME=${MONGO_USER:-root_user}
      - MONGODB_PASSWORD=${MONGO_PASSWORD:-password}
      - MONGODB_DATABASE=top_assist
      - ANALYSIS_NUM_WORKERS=1
      # LLM access variables are in unversioned .env for security.
      - LLM_TEMPERATURE=0.0
    depends_on:
      - mongo
  mongo:
    image: docker.io/mongo:9.0.2
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
