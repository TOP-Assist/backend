services:
  backend:
    restart: on-failure
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - 8000:8000
    environment:
      -
    depends_on:
      - mongo
  mongo:
    image: docker.io/mongo:9.0.2
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
