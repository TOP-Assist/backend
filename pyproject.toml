[project]
name = "backend"
# Derived from the git tag (vX.Y.Z) by uv-dynamic-versioning; see README.
dynamic = ["version"]
description = "The backend for the TOP Assist text optimization application."
license = "AGPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
readme = "README.md"
authors = [
    { name = "Miguel Alves Gomes", email = "alvesgomes@uni-wuppertal.de" },
    { name = "Jannik Schmitt", email = "jannik.schmitt@deepsight.de" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.4",
    "lang-limes>=0.1.4",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "uvicorn>=0.54.0",
    "torch>=2.14.1",
    "openai==2.54.0",
    "de-dep-news-trf",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-pymongo>=0.66b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "hanta>=1.2.1",
]

[dependency-groups]
lint = [
    "ruff>=0.17.5",
    "pre-commit>=4.7.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
# uv-dynamic-versioning does not support the uv_build backend (yet).
requires = ["hatchling>=1.27", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
# Untagged commits after v1.2.0 become 1.2.1.devN+g<hash> instead of 1.2.0.postN.
bump = true

[tool.uv]
# Rebuild the project when the version changes, not only when files change.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
de-dep-news-trf = { url = "https://github.com/explosion/spacy-models/releases/download/de_dep_news_trf-3.8.0/de_dep_news_trf-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
