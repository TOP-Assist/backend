[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miguel Alves Gomes", email = "alvesgomes@uni-wuppertal.de" },
    { name = "Jannik Schmitt", email = "jannik.schmitt@deepsight.de" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.4",
    "lang-limes>=0.1.4",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "uvicorn>=0.54.0",
    "torch>=2.14.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
