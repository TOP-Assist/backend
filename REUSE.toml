version = 1

# Files that cannot carry an SPDX header themselves: generated files, tool
# configuration without comment support, and LLM prompts, which are sent to
# the model verbatim.
[[annotations]]
path = [
    ".python-version",
    ".gitignore",
    ".prettierrc",
    "uv.lock",
    "src/backend/translation/prompts/**",
]
SPDX-FileCopyrightText = [
    "2026 deepsight GmbH",
    "2026 Bergische Universität Wuppertal",
]
SPDX-License-Identifier = "AGPL-3.0-or-later"
